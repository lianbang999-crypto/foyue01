<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佛悦 · 数据后台</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root { --ink:#1b1b1f; --gray:#8a8f8e; --hair:#e3e5e3; --bg:#f7f8f7; --ok:#2e7d32; --warn:#c62828; }
* { box-sizing:border-box; margin:0; }
body { font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
.wrap { max-width:960px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:18px; margin-bottom:14px; }
h2 { font-size:14px; color:var(--gray); margin:18px 0 8px; font-weight:600; }
.tabs { display:flex; gap:6px; margin:12px 0; flex-wrap:wrap; }
.tabs button { border:.8px solid var(--hair); background:#fff; padding:6px 14px; border-radius:9px; cursor:pointer; font-size:13px; }
.tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.card { background:#fff; border:.8px solid var(--hair); border-radius:12px; padding:14px 16px; margin-bottom:12px; overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th,td { border-bottom:.6px solid var(--hair); padding:6px 8px; text-align:left; white-space:nowrap; }
th { color:var(--gray); font-weight:500; }
.num { font-variant-numeric:tabular-nums; }
.badge { font-size:11px; padding:1px 7px; border-radius:8px; background:#eef; }
/* 运营页（四站合并） */
.subnav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.sbtn { border:.8px solid var(--hair); background:#fff; padding:5px 12px; border-radius:8px; cursor:pointer; font-size:12.5px; }
.sbtn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.row { display:flex; align-items:center; gap:10px; justify-content:space-between;
       padding:9px 0; border-bottom:.6px solid var(--hair); font-size:13px; }
.row:last-child { border-bottom:none; }
.row.todo { cursor:pointer; }
.row.todo:hover { background:#fafafa; }
.row b { font-variant-numeric:tabular-nums; }
.dim { color:var(--gray); font-style:normal; font-size:12px; }
.mini { border:.8px solid var(--hair); background:#fff; padding:3px 10px; border-radius:7px;
        cursor:pointer; font-size:12px; margin-left:6px; }
.mini:hover { border-color:var(--ink); }
.kpi { display:flex; flex-wrap:wrap; gap:18px; margin-bottom:6px; }
.kpi > div { min-width:64px; }
.kpi b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
.kpi span { font-size:11.5px; color:var(--gray); }
h3 { font-size:13px; color:var(--gray); font-weight:600; margin:16px 0 4px; }
@media (max-width:640px){ .row { flex-wrap:wrap; } .kpi { gap:12px; } .kpi b { font-size:17px; } }
.badge.pro { background:#e3f2e3; color:var(--ok); }
.badge.ban { background:#fde3e3; color:var(--warn); }
.warn { color:var(--warn); font-weight:600; }
.login { max-width:320px; margin:18vh auto; text-align:center; }
.login input { width:100%; padding:10px 12px; border:.8px solid var(--hair); border-radius:10px; margin:10px 0; font-size:14px; }
.login button, .act { background:var(--ink); color:#fff; border:0; padding:9px 22px; border-radius:10px; cursor:pointer; }
.act.sm { padding:3px 10px; font-size:12px; }
.act.ghost { background:#fff; color:var(--ink); border:.8px solid var(--hair); }
.hidden { display:none; }
input.q { padding:6px 10px; border:.8px solid var(--hair); border-radius:8px; }
.funnel { font-size:13px; color:var(--gray); }
.funnel b { color:var(--ink); }
#msg { position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--ink); color:#fff;
       padding:8px 16px; border-radius:10px; font-size:13px; }
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <h1>佛悦 · 数据后台</h1>
  <input id="key" type="password" placeholder="管理口令" autocomplete="current-password">
  <button onclick="doLogin()">进入</button>
  <p id="loginErr" style="color:var(--warn);font-size:13px"></p>
</div>

<div id="app" class="wrap hidden">
  <h1>佛悦 · 数据后台 <span id="attention" class="warn"></span></h1>
  <div class="tabs">
    <button data-t="ops" class="on">运营</button>
    <button data-t="overview">总览</button>
    <button data-t="users">用户</button>
    <button data-t="subs">订阅</button>
    <button data-t="health">健康</button>
    <button data-t="sites">子站</button>
    <button data-t="retention">留存</button>
    <button data-t="audit">审计</button>
    <button data-t="crashes">崩溃</button>
  </div>
  <div id="content"><div class="card">加载中…</div></div>
</div>

<div id="msg" class="hidden"></div>

<script>
const $ = s => document.querySelector(s);
const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 问道反馈那一栏的小字：把当次的引用自检压成一句话。
   用户说「答偏了」而机器自检也说引用对不上 → 多半是模型答歪了；
   自检说没问题却仍被踩 → 多半是没召回到该召回的段。两种毛病要改的地方不同，
   在这儿分开，胜过事后翻半天。 */
function verifyNote(raw) {
  if (!raw) return '';
  let v; try { v = JSON.parse(raw); } catch { return ''; }
  if (!v || !v.cited) return ' · 未标出处';
  if (!v.faithful) return ' · 自检：引用对不上';
  return ` · 自检通过（${v.cited} 处出处）`;
}
let KEY = sessionStorage.getItem('fy_admin_key') || '';

function msg(t) { const m = $('#msg'); m.textContent = t; m.classList.remove('hidden'); setTimeout(() => m.classList.add('hidden'), 2600); }
async function api(path, body) {
  const r = await fetch('/admin/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Authorization': 'Bearer ' + KEY, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { sessionStorage.removeItem('fy_admin_key'); location.reload(); throw 0; }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
async function doLogin() {
  const key = $('#key').value.trim();
  const r = await fetch('/admin/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
  if (r.ok) { KEY = key; sessionStorage.setItem('fy_admin_key', key); boot(); }
  else $('#loginErr').textContent = (await r.json()).error || '失败';
}
$('#key')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

const fmt = ms => ms ? new Date(ms).toLocaleString('zh-CN', { hour12: false }).slice(0, 17) : '—';
const day = ms => ms ? new Date(ms).toLocaleDateString('zh-CN') : '—';
// 账号脱敏：后台自己人看也不必满屏明文
const maskAcc = a => a.length > 7 ? a.slice(0, 3) + '***' + a.slice(-4) : a;

const KIND_CN = { register:'新注册', login:'登录', app_open:'活跃', apk_download:'APK下载', pay:'新付费', ai_chat:'AI调用', crash:'崩溃', landing_view:'落地页', page_view:'页面访问', order_create:'下单', ai_fail:'AI上游失败', afdian_hook:'爱发电推送', kofi_hook:'Ko-fi推送', play:'播放', download:'下载' };

const views = {
  async overview() {
    const d = await api('overview');
    $('#attention').textContent = d.attention.unclaimed_orders > 0 ? `⚠️ 未认领订单 ${d.attention.unclaimed_orders} 笔` : '';
    const rows = Object.keys(KIND_CN).map(k =>
      `<tr><td>${KIND_CN[k]}</td><td class="num">${d.today[k] ?? '—'}</td><td class="num">${d.yest[k] ?? '—'}</td><td class="num">${d.d7[k] ?? '—'}</td></tr>`).join('');
    const f = d.funnel30;
    const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
    return `
    <div class="card"><h2>今天 / 昨天 / 7 日</h2>
      <table><tr><th></th><th>今天</th><th>昨天</th><th>7日</th></tr>${rows}</table></div>
    <div class="card"><h2>转化漏斗（30 日）</h2>
      <p class="funnel">落地页 <b>${f.landing_view}</b> ─${pct(f.apk_download, f.landing_view)}→ 下载 <b>${f.apk_download}</b>
      ─${pct(f.register, f.apk_download)}→ 注册 <b>${f.register}</b> ─${pct(f.pay, f.register)}→ 付费 <b>${f.pay}</b></p></div>
    <div class="card"><h2>钱（本月）</h2>
      <p>收入 <b>¥${d.money.income_month}</b> · 订阅中 <b>${d.money.subs_active}</b> · 7 日内到期 <b>${d.money.expiring_7d}</b>
      · 账号总数 <b>${d.total_users}</b></p></div>`;
  },

  async users(q) {
    const list = await api('users' + (q ? '?q=' + encodeURIComponent(q) : ''));
    const rows = list.map(u => `<tr>
      <td>${u.id}</td><td title="${u.kind}">${maskAcc(u.account)}</td>
      <td><span class="badge ${u.plan === 'pro' ? 'pro' : ''}">${u.plan}</span>${u.banned_at ? ' <span class="badge ban">封禁</span>' : ''}</td>
      <td>${(u.created_at || '').slice(0, 10)}</td><td>${u.reg_site || '—'}</td><td>${fmt(u.last_seen_at)}</td>
      <td>
        <button class="act sm ghost" onclick="render('userdetail', ${u.id})">详情</button>
        <button class="act sm ghost" onclick="grantPro(${u.id})">补开Pro</button>
        <button class="act sm ghost" onclick="banUser(${u.id}, ${u.banned_at ? 'true' : 'false'})">${u.banned_at ? '解封' : '封禁'}</button>
      </td></tr>`).join('');
    return `<div class="card">
      <input class="q" id="uq" placeholder="搜账号…" value="${q || ''}" onkeydown="if(event.key==='Enter')render('users',this.value)">
      <table style="margin-top:8px"><tr><th>ID</th><th>账号</th><th>状态</th><th>注册</th><th>来源</th><th>最后活跃</th><th>操作</th></tr>${rows}</table>
      <p style="font-size:11px;color:var(--gray);margin-top:8px">🔒 只显示元数据；笔记 / 日记 / 日程内容永不出现在后台。</p></div>`;
  },

  async subs() {
    const d = await api('subs');
    const un = d.unclaimed.map(o => `<tr><td>${o.order_no}</td><td>¥${o.amount}</td><td>${fmt(o.handled_at)}</td>
      <td><button class="act sm" onclick="bindOrder('${o.order_no}')">绑定到账号</button></td></tr>`).join('');
    const os = d.orders.map(o => `<tr><td>${o.channel}</td><td>${o.order_no}</td><td>${o.user_id ?? '<span class=warn>未认领</span>'}</td>
      <td>¥${o.amount}</td><td>${fmt(o.handled_at)}</td></tr>`).join('');
    const ex = d.expiring.map(e => `<tr><td>${e.user_id}</td><td>${day(e.expires_at)}</td></tr>`).join('');
    return `
    ${d.unclaimed.length ? `<div class="card"><h2 class="warn">⚠️ 未认领订单（有人付了钱没拿到货）</h2>
      <table><tr><th>订单号</th><th>金额</th><th>时间</th><th></th></tr>${un}</table></div>` : ''}
    <div class="card"><h2>生成兑换码</h2>
      <button class="act sm ghost" onclick="genCode(31)">31 天码</button>
      <button class="act sm ghost" onclick="genCode(366)">366 天码</button>
      <span id="codeOut" style="font-size:12px;margin-left:8px"></span></div>
    <div class="card"><h2>订单流水（近 50）</h2>
      <table><tr><th>渠道</th><th>订单号</th><th>用户</th><th>金额</th><th>时间</th></tr>${os}</table></div>
    <div class="card"><h2>7 日内到期</h2><table><tr><th>用户</th><th>到期日</th></tr>${ex || '<tr><td colspan=2>无</td></tr>'}</table></div>`;
  },

  async health() {
    const d = await api('health');
    const cv = d.crash_by_ver.map(c => `<tr><td>${c.ver}</td><td class="num">${c.c}</td></tr>`).join('');
    const failRate = d.ai_chat_24h ? (d.ai_fail_24h / d.ai_chat_24h * 100).toFixed(1) + '%' : '—';
    return `<div class="card"><h2>24 小时</h2>
      <p>AI 调用 <b>${d.ai_chat_24h}</b> · AI 上游失败 <b class="${d.ai_fail_24h > 20 ? 'warn' : ''}">${d.ai_fail_24h}</b>（失败率 ${failRate}）
      · 崩溃 <b class="${d.crashes_24h > 5 ? 'warn' : ''}">${d.crashes_24h}</b></p>
      ${cv ? `<h2>崩溃按版本</h2><table><tr><th>版本</th><th>次数</th></tr>${cv}</table>` : ''}</div>`;
  },

  async sites(sel) {
    const site = sel || 'looka';
    const SITES = [['looka','Looka'],['zhi','自知录'],['shop','流通处'],['foyue','主站'],['wenchao','文钞'],['game','游戏'],['bojing','播经台']];
    const chips = SITES.map(([k,n]) =>
      `<button class="act sm ${k===site?'':'ghost'}" onclick="render('sites','${k}')">${n}</button>`).join(' ');
    const d = await api('site?site=' + site + '&days=30');
    const kindRows = d.kinds.map(k => `<tr><td>${KIND_CN[k.kind] || k.kind}</td><td class="num">${k.c}</td></tr>`).join('');
    const uaRows = d.ua.map(u => `<tr><td>${u.ua_class}</td><td class="num">${u.c}</td></tr>`).join('');
    const refRows = d.ref.map(r => `<tr><td>${r.ref}</td><td class="num">${r.c}</td></tr>`).join('');
    // 14 天趋势条形图（纯 CSS）
    const mx = Math.max(1, ...d.trend14.map(t => t.c));
    const bars = d.trend14.map(t =>
      `<div title="${t.d}: ${t.c} 次 / ${t.u} 人" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="background:#55B04B;border-radius:3px 3px 0 0;height:${Math.round(t.c / mx * 70)}px"></div>
        <span style="font-size:9px;color:var(--gray);text-align:center">${t.d.slice(8)}</span></div>`).join('');
    const hmx = Math.max(1, ...d.hourly);
    const hbars = d.hourly.map((c, h) =>
      `<div title="${h}点: ${c}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="background:#4A7DDC;border-radius:2px 2px 0 0;height:${Math.round(c / hmx * 44)}px"></div>
        ${h % 6 === 0 ? `<span style="font-size:9px;color:var(--gray);text-align:center">${h}</span>` : '<span style="height:14px"></span>'}</div>`).join('');
    const empty = !d.kinds.length;
    return `<div class="card">${chips}</div>
    ${empty ? `<div class="card"><p style="color:var(--gray)">该站还没有数据。主站/文钞/游戏需要在页面里贴一行统计脚本（见 EXECUTION.md P3-v2），贴上后这里自动出数。</p></div>` : `
    <div class="card"><h2>14 天活动（悬停看数值）</h2>
      <div style="display:flex;gap:2px;align-items:flex-end;height:92px">${bars}</div></div>
    <div class="card"><h2>时段分布（北京时间 —— 用户什么时候在用）</h2>
      <div style="display:flex;gap:1px;align-items:flex-end;height:66px">${hbars}</div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div class="card" style="flex:1;min-width:180px"><h2>30 日事件</h2><table>${kindRows}</table></div>
      <div class="card" style="flex:1;min-width:140px"><h2>设备</h2><table>${uaRows || '<tr><td>—</td></tr>'}</table></div>
      <div class="card" style="flex:1;min-width:160px"><h2>来源 Top</h2><table>${refRows || '<tr><td>（直接访问）</td></tr>'}</table></div>
    </div>`}`;
  },

  async retention() {
    const d = await api('retention');
    return `<div class="card"><h2>留存（了解用户是否回来）</h2>
      <p>次日留存 <b>${d.d1 == null ? '样本不足' : d.d1 + '%'}</b>（近 14 天注册 ${d.d1_n} 人）</p>
      <p>7 日留存 <b>${d.d7 == null ? '样本不足' : d.d7 + '%'}</b>（样本 ${d.d7_n} 人）</p>
      <p>周活 / 总账号 <b>${d.wau} / ${d.total}</b></p>
      <p style="font-size:12px;color:var(--gray)">口径：注册后第 N 天之后仍产生过任何事件。样本随埋点积累变准。</p></div>`;
  },

  async userdetail(uid) {
    const d = await api('user?id=' + uid);
    const evs = d.events.map(e =>
      `<tr><td>${fmt(e.ts)}</td><td>${e.site}</td><td>${KIND_CN[e.kind] || e.kind}</td><td>${e.ua_class || ''}</td><td style="font-size:11px;color:var(--gray)">${e.meta !== '{}' ? e.meta : ''}</td></tr>`).join('');
    return `<div class="card">
      <button class="act sm ghost" onclick="render('users')">← 返回列表</button>
      <h2 style="margin-top:10px">用户 #${d.user.id} · ${maskAcc(d.user.account)}</h2>
      <p>注册 ${(d.user.created_at || '').slice(0, 10)}（${d.user.reg_site || '早期'}）
        · <span class="badge ${d.plan.plan === 'pro' ? 'pro' : ''}">${d.plan.plan}</span>${d.plan.expiry ? ' 至 ' + day(d.plan.expiry) : ''}
        ${d.user.banned_at ? ' · <span class="badge ban">封禁</span>' : ''}</p>
      <p>近 30 天活跃 <b>${d.active_days_30}</b> 天 · 最后活跃 ${fmt(d.user.last_seen_at)}
        · 鹿角 ${d.antler.granted}+${d.antler.paid}</p>
      <h2>最近行为（只有事件元数据，永不含内容）</h2>
      <table><tr><th>时间</th><th>站</th><th>事件</th><th>设备</th><th></th></tr>${evs || '<tr><td colspan=5>暂无</td></tr>'}</table></div>`;
  },

  async audit() {
    const list = await api('audit');
    const rows = list.map(a => `<tr><td>${fmt(a.ts)}</td><td>${a.action}</td><td>${a.target}</td><td style="white-space:normal;font-size:12px">${a.detail}</td></tr>`).join('');
    return `<div class="card"><table><tr><th>时间</th><th>操作</th><th>对象</th><th>详情</th></tr>${rows || '<tr><td colspan=4>暂无</td></tr>'}</table></div>`;
  },

  // ---- 运营：四站待办与处理（2026-08-30 合并原 /admin.html） ----
  async ops(sub) {
    const site = sub || 'todo';
    const nav = [['todo','待办'],['bojing','播经台'],['wenchao','文钞'],['zhi','自知录'],['game','须弥山']]
      .map(([k, n]) => `<button class="sbtn${site === k ? ' on' : ''}" onclick="render('ops','${k}')">${n}</button>`).join('');
    let body = '';

    if (site === 'todo') {
      const d = await api('todo');
      body = d.items.length
        ? d.items.map(i => `<div class="row todo" onclick="render('ops','${i.site}')">
             <span>${i.label}<i class="dim"> · ${i.note}</i></span><b class="warn">${i.n}</b></div>`).join('')
        : '<p class="dim">今日无事。四站均无待处理事项。</p>';
      if (d.errs && d.errs.length) body += `<p class="dim" style="margin-top:10px">取数异常：${d.errs.join('；')}</p>`;
    }

    if (site === 'bojing') {
      const [st, rp, af] = await Promise.all([
        api('ops?site=bojing'), api('ops?site=bojing&kind=reports'), api('ops?site=bojing&kind=askfb')]);
      body = `<div class="kpi"><div><b>${st.today}</b><span>今日留言</span></div>
        <div><b>${st.total}</b><span>累计留言</span></div>
        <div><b>${st.banned}</b><span>封禁设备</span></div>
        <div><b class="${st.openReports ? 'warn' : ''}">${st.openReports}</b><span>待处理报错</span></div>
        <div><b>${st.askUp ?? 0}</b><span>问道有益</span></div>
        <div><b class="${st.askPending ? 'warn' : ''}">${st.askPending ?? 0}</b><span>问道待看</span></div></div>
        <h3>报错 / 纠错</h3>` + (rp.items.length ? rp.items.map(r => `<div class="row">
          <span>${esc(r.text || '')}<i class="dim"> · ${esc([r.site, r.kind, r.target].filter(Boolean).join(' / '))}</i></span>
          ${r.status === 'open'
            ? `<span><button class="mini" onclick="opsAct('bojing','mark',{id:${r.id},status:'done'})">已办</button>
               <button class="mini" onclick="opsAct('bojing','mark',{id:${r.id},status:'ignored'})">忽略</button></span>`
            : `<i class="dim">${r.status === 'done' ? '已办' : '已忽略'}</i>`}</div>`).join('') : '<p class="dim">暂无报错</p>')
        /* 问道「答偏了」的反馈。这一栏不是拿来看分数的，是拿来找检索短板的：
           问题原文 + 当次的引用自检并排摆着，一眼看出是没召回、还是召回了却答歪了。 */
        + `<h3>问道 · 答偏了<i class="dim"> ${af.note ? '（' + esc(af.note) + '）' : '　默认只列踩'}</i></h3>`
        + ((af.items || []).length ? af.items.slice(0, 60).map(it => `<div class="row">
          <span>${esc((it.q || '').slice(0, 60))}
            <i class="dim"> · ${new Date(it.ts).toLocaleDateString('zh-CN')}${verifyNote(it.verify)}</i></span>
          ${it.handled
            ? '<i class="dim">已看</i>'
            : `<button class="mini" onclick="opsAct('bojing','askfb-handled',{id:${it.id}})">标记已看</button>`}
          </div>`).join('') : '<p class="dim">暂无反馈</p>');
    }

    if (site === 'wenchao') {
      const [st, fb] = await Promise.all([api('ops?site=wenchao'), api('ops?site=wenchao&kind=feedback')]);
      if (st.__err) return `<div class="card warn">文钞：${st.__err}</div>`;
      body = `<div class="kpi"><div><b>${st.up}</b><span>有帮助</span></div>
        <div><b>${st.down}</b><span>需更正</span></div>
        <div><b class="${st.pendingCorrections ? 'warn' : ''}">${st.pendingCorrections}</b><span>待处理</span></div>
        <div><b>${st.kb ?? '—'}</b><span>知识库段</span></div></div>
        <h3>反馈</h3>` + ((fb.items || []).length ? fb.items.slice(0, 60).map(it => `<div class="row">
          <span>${esc((it.q || '').slice(0, 60))}${it.note ? `<i class="dim"> · 更正：${esc(it.note)}</i>` : ''}</span>
          ${it.vote === 'down' && !it.handled
            ? `<button class="mini" onclick="opsAct('wenchao','handled',{key:'${esc(it.key)}'})">标记已办</button>`
            : `<i class="dim">${it.vote === 'up' ? '有帮助' : '已办'}</i>`}</div>`).join('') : '<p class="dim">暂无反馈</p>');
    }

    if (site === 'zhi') {
      const [st, rp] = await Promise.all([api('ops?site=zhi'), api('ops?site=zhi&kind=reports')]);
      if (st.__err) return `<div class="card warn">自知录：${st.__err}</div>`;
      body = `<div class="kpi"><div><b>${st.users}</b><span>用户</span></div>
        <div><b>${st.notes}</b><span>记录</span></div>
        <div><b>${st.shared}</b><span>广场在展</span></div>
        <div><b>${st.activeToday}</b><span>今日记录人</span></div>
        <div><b>${st.aiToday}</b><span>今日 AI</span></div>
        <div><b class="${st.pendingReports ? 'warn' : ''}">${st.pendingReports}</b><span>待处理举报</span></div></div>
        <h3>举报</h3>` + ((rp.reports || []).length ? rp.reports.map(r => `<div class="row">
          <span>${esc((r.content || '（记录已删）').slice(0, 60))}<i class="dim"> · ${esc(r.author_nick || '匿名')}${r.reason ? ' · ' + esc(r.reason) : ''}</i></span>
          ${r.handled ? `<i class="dim">已办</i>`
            : `<span><button class="mini" onclick="opsAct('zhi','takedown',{noteId:${r.note_id},takedown:true})">下架</button>
               <button class="mini" onclick="opsAct('zhi','takedown',{noteId:${r.note_id},takedown:false})">保留</button></span>`}</div>`).join('')
          : '<p class="dim">暂无举报</p>');
    }

    if (site === 'game') {
      const d = await api('ops?site=game');
      if (d.__err) return `<div class="card warn">须弥山：${d.__err}</div>`;
      body = `<div class="kpi"><div><b>${d.installs}</b><span>装机</span></div>
        <div><b>${d.active1}</b><span>今日活跃</span></div>
        <div><b>${d.active7}</b><span>七日活跃</span></div>
        <div><b>${d.active30 ?? '—'}</b><span>卅日活跃</span></div>
        <div><b>${d.downloads}</b><span>APK 下载</span></div></div>`
        + (d.byVer ? '<h3>版本分布</h3>' + d.byVer.map(v => `<div class="row"><span>${esc(v.ver)}</span><b>${v.n}</b></div>`).join('') : '');
    }

    return `<div class="card"><div class="subnav">${nav}</div>${body}</div>`;
  },

  async crashes() {
    const list = await api('crashes');
    const rows = list.map(c => `<tr><td>${fmt(c.created_at)}</td><td>${c.ver}</td><td>${esc(c.model || '')}</td>
      <td><pre style="max-width:640px;white-space:pre-wrap;font-size:11px;margin:0">${esc((c.stack || '').slice(0, 1200))}</pre></td></tr>`).join('');
    return `<div class="card"><h3>崩溃日志（最近 50 条）</h3>
      <table><tr><th>时间</th><th>版本</th><th>机型</th><th>堆栈</th></tr>${rows || '<tr><td colspan=4>暂无 —— 好消息</td></tr>'}</table></div>`;
  }
};

// —— 写操作全部二次确认 ——
async function grantPro(uid) {
  const days = prompt(`给用户 ${uid} 补开 Pro，天数：`, '31');
  if (!days) return;
  if (!confirm(`确认给用户 ${uid} 补开 ${days} 天 Pro？`)) return;
  try { const r = await api('grant', { user_id: uid, days: +days }); msg('已开通至 ' + day(r.expires_at)); render('users'); }
  catch (e) { msg(e.message); }
}
async function banUser(uid, unban) {
  if (!confirm(unban ? `解封用户 ${uid}？` : `封禁用户 ${uid}？其会话将被踢出`)) return;
  try { await api('ban', { user_id: uid, unban }); msg('完成'); render('users'); } catch (e) { msg(e.message); }
}
async function bindOrder(no) {
  const uid = prompt(`把订单 ${no} 绑定到哪个用户 ID？`);
  if (!uid) return;
  if (!confirm(`确认绑定订单 ${no} → 用户 ${uid} 并开通对应时长？`)) return;
  try { await api('bind-order', { order_no: no, user_id: +uid }); msg('已绑定并开通'); render('subs'); } catch (e) { msg(e.message); }
}
async function opsAct(site, act, extra) {
  const need = { takedown: '从广场下架这条？原记录仍留在作者自己的录中。', del: '删除这条留言？' };
  if (need[act] && extra.takedown !== false && !confirm(need[act])) return;
  try { await api('ops-act', { site, act, ...extra }); msg('已处理'); render('ops', site); }
  catch (e) { msg(e.message); }
}
async function genCode(days) {
  if (!confirm(`生成 1 张 ${days} 天订阅码？`)) return;
  try { const r = await api('gencode', { days, count: 1 }); $('#codeOut').textContent = r.codes.join(' '); msg('已生成'); render('audit'); }
  catch (e) { msg(e.message); }
}

let cur = 'ops';
async function render(t, arg) {
  cur = t || cur;
  const tabKey = cur === 'userdetail' ? 'users' : cur;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tabKey));
  $('#content').innerHTML = '<div class="card">加载中…</div>';
  try { $('#content').innerHTML = await views[cur](arg); }
  catch (e) { $('#content').innerHTML = `<div class="card warn">加载失败：${e.message || e}</div>`; }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => render(b.dataset.t));

async function boot() {
  $('#loginView').classList.add('hidden');
  $('#app').classList.remove('hidden');
  render('ops');
}
if (KEY) boot(); else $('#loginView').classList.remove('hidden');
</script>
